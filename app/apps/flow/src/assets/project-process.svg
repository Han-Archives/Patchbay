<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1030" role="img" aria-labelledby="archtitle archdesc">
<title id="archtitle">상담 Plan과 운영 실행을 분리한 Patchbay 아키텍처</title>
<desc id="archdesc">상담에서 요구사항과 Plan을 결정하고 PRD를 검토해 채택한다. 채택한 설계 버전은 구현 연결을 거쳐 운영 실행의 기준이 된다. 운영 리더는 범위 안에서 작업자와 모델을 배정하고 LangGraph가 Act Check Deploy를 수행한다. 구현 오류는 Act로, 요구사항 변경은 상담으로 돌아간다. 상담과 실행 기록은 분리하고 승인본 버전과 출처로 연결한다. 상담 평가와 개선은 별도 작업으로 진행하며 외부 조회는 원본별 권한을 검사한다.</desc>
<defs><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315de6" stroke-width="1.5"/></marker><marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#14866f" stroke-width="1.5"/></marker><marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b76a1c" stroke-width="1.5"/></marker>
