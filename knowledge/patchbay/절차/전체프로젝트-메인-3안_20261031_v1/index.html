<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Patchbay · 전체 프로젝트 홈 3안</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="artifacts.css">
  <script src="artifacts.js" defer></script>
  <script src="prototype.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <div class="study-bar">
    <a class="study-title" href="comparison.html">PATCHBAY <span>HOME STUDY / 01</span></a>
    <nav class="variants" aria-label="메인 화면 시안">
      <button data-variant="a" aria-pressed="true">A <span>전체 현황</span><small>추천</small></button>
      <button data-variant="b" aria-pressed="false">B <span>오늘 할 일</span></button>
      <button data-variant="c" aria-pressed="false">C <span>단계 비교</span></button>
    </nav>
    <span class="study-note">시안용 예시 데이터</span>
    <button class="text-button" id="open-plan">설계 원칙 ↗</button>
  </div>
  <div class="app-shell">
    <aside class="rail" aria-label="작업 공간 이동">
      <button class="brand" data-home aria-label="Patchbay 전체 프로젝트 홈">
        <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect width="32" height="32" rx="9.6" fill="currentColor"/><g fill="none" stroke="#ececec" stroke-width="2.2" stroke-linecap="round"><path d="M11.9 10.4C19.7 10.4 22.7 14.4 22.7 18.6"/><circle cx="9.3" cy="10.4" r="2.6"/><circle cx="9.3" cy="21.6" r="2.6"/><circle cx="22.7" cy="21.6" r="2.6"/></g></svg>
      </button>
      <button class="rail-home" data-home aria-label="전체 프로젝트 홈" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3Z"/></svg><span>홈</span></button>
      <div class="rail-divider"></div>
      <div id="rail-projects"></div>
      <button class="rail-add" data-add aria-label="프로젝트 등록">＋</button>
      <div class="rail-bottom"><span class="status-light"></span><span>연결 상태</span><button id="connections" aria-label="연결 상태 보기">⋯</button></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><b>Patchbay</b><span>/</span><span>전체 프로젝트</span></div>
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="프로젝트·결과물 검색" aria-label="프로젝트와 결과물 검색"><kbd>/</kbd></label>
        <button class="button primary" data-add><span>＋</span> 프로젝트 등록</button>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="prototype-foot"><span id="variant-caption"></span><span>화면·수치는 모두 예시입니다. 실제 저장이나 실행으로 이어지지 않습니다.</span></footer>
    </div>
  </div>
  <dialog id="detail" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
</body>
</html>
