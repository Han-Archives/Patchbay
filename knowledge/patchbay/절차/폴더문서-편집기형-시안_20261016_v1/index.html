const ago=t=>{const h=Math.round((now-t)/36e5);return h<1?"방금":h<24?h+"시간 전":Math.round(h/24)+"일 전"};
const kb=b=>b<1024?b+" B":(b/1024).toFixed(b<10240?1:0)+" KB";
const files=n=>n.dir?n.children.flatMap(files):[n];
const recent=n=>Math.max(...files(n).map(x=>x.mtime));
const text=p=>S.drafts[p]??byPath.get(p).content;
const dirty=p=>S.drafts[p]!==undefined&&S.drafts[p]!==byPath.get(p).content;
const canEdit=n=>!S.ro&&n.pol==="edit";
const ico=n=>/\.md$/.test(n.name)?"¶":/\.jsonl$/.test(n.name)?"≡":/\.(json|ya?ml)$/.test(n.name)?"{}":"·";
const polTag=n=>n.dir||!POL[n.pol].t?"":`<span class="pol${n.pol==="live"?" live":""}" title="${POL[n.pol].n}">${POL[n.pol].t}</span>`;

function md(src){let out="",inList=false,body=src;const fm=src.match(/^---\n([\s\S]*?)\n---\n?/);if(fm){out+=`<div class="fm">${esc(fm[1])}</div>`;body=src.slice(fm[0].length)}
 for(const l of body.split("\n")){const t=esc(l).replace(/`([^`]+)`/g,(_,c)=>`<code>${c}</code>`);
  if(/^- /.test(l)){if(!inList){out+="<ul>";inList=true}out+=`<li>${t.slice(2)}</li>`;continue}if(inList){out+="</ul>";inList=false}
  if(/^## /.test(l))out+=`<h2>${t.slice(3)}</h2>`;else if(/^# /.test(l))out+=`<h1>${t.slice(2)}</h1>`;else if(l.trim())out+=`<p>${t}</p>`}
 return out+(inList?"</ul>":"")}
/* 편집 중 오른쪽 칸: 마크다운은 렌더, JSON은 형식 검사 + 읽은 결과, YAML은 서버 검사 안내 */
function preview(n){const src=text(n.path);
 if(/\.md$/.test(n.name))return`<div class="lbl">미리보기</div><div class="md">${md(src)}</div>`;
 if(/\.json$/.test(n.name)){try{const v=JSON.parse(src);const list=Array.isArray(v.todos)?v.todos.map(t=>`<li>${t.done?"☑":"☐"} ${esc(t.title)}</li>`).join(""):"";
   return`<div class="lbl">형식 검사</div><div class="check ok"><span>✓ JSON 형식이 맞습니다${list?` · 할 일 ${v.todos.length}건`:""}</span>${list?`<ul>${list}</ul>`:""}</div>`}
  catch(e){return`<div class="lbl">형식 검사</div><div class="check bad">✗ JSON 형식이 틀렸습니다 — 저장할 수 없습니다<br><small style="color:inherit">${esc(e.message)}</small></div>`}}
 return`<div class="lbl">형식 검사</div><div class="check">YAML은 저장할 때 서버가 검사합니다. 틀리면 저장하지 않고 줄 번호를 알려 줍니다.</div>`}
const jsonBad=n=>{if(!/\.json$/.test(n.name))return false;try{JSON.parse(text(n.path));return false}catch{return true}};
const rendered=n=>/\.md$/.test(n.name)?`<div class="md">${md(text(n.path))}</div>`:`<pre class="code">${esc(text(n.path))}</pre>`;

function row(n,depth){return`<button class="row" role="treeitem" data-p="${esc(n.path)}" aria-selected="${S.sel===n.path}" style="padding-left:${10+depth*14}px">${n.dir?`<span class="car${S.open.has(n.path)?" open":""}">▶</span>`:'<span class="car"></span>'}<span class="ico">${n.dir?"":ico(n)}</span><span class="nm">${esc(n.name)}${n.dir?"/":""}</span>${dirty(n.path)?'<span class="dirty" title="저장 안 함"></span>':""}${n.dir?`<span class="meta">${files(n).length}</span>`:`<span class="meta"></span>${polTag(n)}`}</button>`}
function tree(n,depth){return n.children.map(c=>row(c,depth)+(c.dir&&S.open.has(c.path)?tree(c,depth+1):"")).join("")}
const crumb=n=>`<div class="crumb"><span>${["patchbay",...(n.path?n.path.split("/"):[])].map((x,i,a)=>i===a.length-1?`<b>${esc(x)}</b>`:esc(x)).join(" / ")}</span><em>${esc(n.what)}</em></div>`;

function head(n){if(n.dir)return`${crumb(n)}<span class="sp"></span><small>폴더</small>`;
 const meta=`<small>${kb(n.size)} · ${ago(n.mtime)}</small>`;
 let act;if(S.ro)act='<span class="pol">조회 전용</span>';
 else if(n.pol!=="edit")act=`<span class="pol${n.pol==="live"?" live":""}">읽기 전용</span>`;
 else if(S.mode==="edit")act=`<button class="btn" data-a="cancel">취소</button><button class="btn pri" data-a="save" ${dirty(n.path)&&!jsonBad(n)?"":"disabled"}>저장</button>`;
 else act=`<span class="seg"><button aria-pressed="true">보기</button><button data-a="edit">편집</button></span>`;
 return`${crumb(n)}<span class="sp"></span>${meta}${act}`}
function notes(n){let o="";
 if(n.pol!=="edit")o+=`<div class="note info">${n.pol==="live"?"≡ 이 파일은 지금도 쓰이고 있어서 읽기 전용입니다. 고치려면 대화방 · Log 화면에서 합니다.":"⟳ 자동으로 만들어지는 파일이라 읽기 전용입니다. 고쳐도 다음에 다시 만들 때 덮어씁니다."}</div>`;
 if(S.conflict===n.path)o+=`<div class="note warn">⚠ 연 뒤에 이 파일이 화면 밖에서 바뀌었습니다 (에이전트가 차례 끝에 고쳤을 수 있습니다). 저장하면 그 변경을 덮어씁니다.<span style="flex:1"></span><button class="btn" data-a="reload">바뀐 내용 다시 읽기</button><button class="btn" data-a="force">내 것으로 저장</button></div>`;
 if(S.saved===n.path)o+=`<div class="note ok">저장했습니다 — 디스크의 파일이 바뀌었습니다.</div>`;return o}
function fileBody(n){
 if(S.mode==="edit"&&canEdit(n))return notes(n)+`<div class="split" style="height:calc(100% - ${S.conflict||S.saved?56:0}px)"><div><div class="lbl" style="font-size:11px;color:var(--muted);margin-bottom:6px">원문 · 편집</div><textarea class="ed" data-a="type" aria-label="${esc(n.name)} 편집">${esc(text(n.path))}</textarea></div><div id="pv">${preview(n)}</div></div>`;
 return notes(n)+rendered(n)}
function folderBody(n){const kids=n.children,all=files(n),c={edit:0,auto:0,live:0};all.forEach(x=>c[x.pol]++);
 return`<div class="card"><span class="lbl">이 폴더는</span><div class="desc">${esc(n.what)}</div>
 <div class="stats"><span><b>${kids.filter(k=>k.dir).length}</b>폴더</span><span><b>${kids.filter(k=>!k.dir).length}</b>파일</span><span><b>${all.length}</b>아래 전체</span><span><b>${ago(recent(n))}</b>최근 수정</span></div>
 <div class="stats"><span><b>${c.edit}</b>편집 가능</span><span><b>${c.auto}</b>자동 생성</span><span><b>${c.live}</b>쓰는 중</span></div></div>
 <div class="kids">${kids.map(k=>`<button class="row" data-p="${esc(k.path)}"><span class="ico">${k.dir?"▸":ico(k)}</span><span class="nm">${esc(k.name)}${k.dir?"/":""}</span><span class="meta">${k.dir?k.children.length+"개":kb(k.size)} · ${ago(k.dir?recent(k):k.mtime)}</span>${polTag(k)}</button>`).join("")}</div>`}

function draw(){const n=byPath.get(S.sel);
 const tabs=S.tabs.map(p=>`<button class="ftab" data-tab="${esc(p)}" aria-selected="${p===S.sel}">${esc(byPath.get(p).name)}${dirty(p)?'<span class="dirty"></span>':""}<span class="x" data-close="${esc(p)}" aria-label="닫기">×</span></button>`).join("");
 document.getElementById("ro").setAttribute("aria-pressed",S.ro);
 document.getElementById("app").innerHTML=`<div class="pane"><nav class="side" aria-label="폴더"><div class="rootbox"><b>patchbay</b><small>workspace/projects/patchbay</small><small style="font-family:var(--font)">${files(ROOT).length}개 파일 · 이 프로젝트만</small></div><div class="scroll" role="tree">${tree(ROOT,0)}</div><div class="legend"><span><span class="pol" style="visibility:hidden">자동</span>표시 없음 — 편집 가능</span><span><span class="pol">자동</span>자동 생성 — 읽기 전용</span><span><span class="pol live">쓰는 중</span>지금도 쓰임 — 읽기 전용</span></div></nav><section class="main"><div class="ftabs" role="tablist">${tabs}</div><div class="head">${head(n)}</div><div class="body">${n.dir?folderBody(n):fileBody(n)}</div></section></div>`}
function openParents(p){let q=p;while(q.includes("/")){q=q.slice(0,q.lastIndexOf("/"));S.open.add(q)}}
function pick(p){const n=byPath.get(p);
 if(n.dir){if(S.sel===p&&S.open.has(p))S.open.delete(p);else S.open.add(p)}
 openParents(p);if(!n.dir&&!S.tabs.includes(p))S.tabs.push(p);
 S.mode=!n.dir&&S.drafts[p]!==undefined?"edit":"view";S.sel=p;S.saved=null;S.conflict=null;draw()}
function go(k){S.drafts={};S.base={};S.conflict=null;S.saved=null;S.mode="view";S.ro=false;
 const at={view:"log/records/2026-10-16.md",edit:"todos.json",md:"DASHBOARD.proposed.md",live:"rooms/2026-10-16-96516c51.jsonl",dir:"rooms",conflict:"todos.json"}[k]||"log/records/2026-10-16.md";
 S.tabs=["log/records/2026-10-16.md","todos.json"];if(k==="md"||k==="live")S.tabs.push(at);
 if(k==="dir")S.open.add("rooms");pick(at);
 const n=byPath.get(at);if(k==="edit"||k==="md"||k==="conflict"){S.mode="edit";S.drafts[at]=k==="md"?n.content+"\n- 고치는 중":n.content.replace('"done": false','"done": true');S.base[at]=n.mtime}
 if(k==="conflict")S.conflict=at;draw()}
document.getElementById("bar").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});
document.getElementById("ro").onclick=()=>{S.ro=!S.ro;S.mode="view";S.drafts={};S.conflict=null;draw()};
document.getElementById("ext").onclick=()=>{const n=byPath.get(S.sel);if(n.dir)return alert("파일을 먼저 고르세요.");n.content+=/\.json$/.test(n.name)?"":"\n\n- (밖에서 더한 줄)";n.mtime=now;if(S.mode==="edit"&&S.drafts[n.path]!==undefined)S.conflict=n.path;draw()};
const app=document.getElementById("app");
app.addEventListener("click",e=>{const x=e.target.closest("[data-close]");if(x){e.stopPropagation();const p=x.dataset.close;S.tabs=S.tabs.filter(t=>t!==p);delete S.drafts[p];if(S.sel===p){S.sel=S.tabs.at(-1)??"";S.mode=S.drafts[S.sel]!==undefined?"edit":"view"}return draw()}
 const t=e.target.closest("[data-tab]");if(t){S.sel=t.dataset.tab;S.mode=S.drafts[S.sel]!==undefined?"edit":"view";S.conflict=null;S.saved=null;return draw()}
 const r=e.target.closest("[data-p]");if(r)return pick(r.dataset.p);
 const a=e.target.closest("[data-a]")?.dataset.a,n=byPath.get(S.sel);if(!a||a==="type")return;
 if(a==="edit"){S.mode="edit";S.drafts[n.path]=n.content;S.base[n.path]=n.mtime}
 else if(a==="cancel"){if(dirty(n.path)&&!confirm("변경을 버릴까요?"))return;delete S.drafts[n.path];S.mode="view";S.conflict=null}
 else if(a==="save"){if(n.mtime!==S.base[n.path]||S.conflict===n.path){S.conflict=n.path;return draw()}n.content=S.drafts[n.path];n.mtime=now;delete S.drafts[n.path];S.mode="view";S.saved=n.path}
 else if(a==="force"){n.content=S.drafts[n.path];delete S.drafts[n.path];S.mode="view";S.conflict=null;S.saved=n.path}
 else if(a==="reload"){S.drafts[n.path]=n.content;S.base[n.path]=n.mtime;S.conflict=null}
 draw()});
app.addEventListener("input",e=>{if(e.target.dataset.a!=="type")return;const p=S.sel,n=byPath.get(p),was=dirty(p)+"|"+jsonBad(n);S.drafts[p]=e.target.value;
 if(was!==dirty(p)+"|"+jsonBad(n)){const pos=e.target.selectionStart;draw();const ta=app.querySelector("textarea");ta.focus();ta.setSelectionRange(pos,pos)}else{const pv=document.getElementById("pv");if(pv)pv.innerHTML=preview(n)}});
const h=location.hash.slice(1);h?go(h):draw();
</script>
